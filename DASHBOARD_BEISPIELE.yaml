## 6. Wochenübersicht (mit Kalender)

```yaml
type: vertical-stack
cards:
  - type: markdown
    content: "# 📅 Wochenplan"
  
  - type: custom:atomic-calendar-revive
    entities:
      - entity: calendar.norish_speiseplan
        color: orange
    maxDaysToShow: 7
    showDate: true
    showMonth: true
    
  - type: horizontal-stack
    cards:
      - type: picture-entity
        entity: sensor.norish_mittagessen
        name: Heute Mittag
      - type: picture-entity
        entity: sensor.norish_abendessen
        name: Heute Abend
```

**Hinweis:** Benötigt [atomic-calendar-revive](https://github.com/totaldebug/atomic-calendar-revive)

