## 5. Mit Rezept-Details (Markdown)

```yaml
type: markdown
content: |
  {% set meal = states.sensor.norish_mittagessen %}
  {% if meal.attributes.images %}
  
  ## 🍽️ Mittagessen Heute
  
  ![{{ meal.state }}]({{ meal.attributes.images[0].url }})
  
  ### {{ meal.state }}
  
  {% if meal.attributes.raw_data and meal.attributes.raw_data|length > 0 %}
  {% set recipe = meal.attributes.raw_data[0] %}
  
  {% if recipe.description %}
  {{ recipe.description }}
  {% endif %}
  
  {% if recipe.cooking_time %}
  ⏱️ Zubereitungszeit: {{ recipe.cooking_time }} Minuten
  {% endif %}
  
  {% if recipe.servings %}
  👥 Portionen: {{ recipe.servings }}
  {% endif %}
  {% endif %}
  
  {% else %}
  
  ## Kein Mittagessen geplant
  
  {% endif %}
```

