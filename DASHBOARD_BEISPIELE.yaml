## 9. Mit Conditional Card (nur wenn Bild vorhanden)

```yaml
type: vertical-stack
cards:
  # Zeige nur, wenn Mittagessen geplant ist
  - type: conditional
    conditions:
      - entity: sensor.norish_mittagessen
        state_not: "Kein Plan"
    card:
      type: picture-entity
      entity: sensor.norish_mittagessen
      show_state: true
  
  # Fallback wenn nichts geplant
  - type: conditional
    conditions:
      - entity: sensor.norish_mittagessen
        state: "Kein Plan"
    card:
      type: markdown
      content: |
        ## 🤷 Heute nichts geplant
        
        Füge ein Rezept im Kalender hinzu!
```

---

