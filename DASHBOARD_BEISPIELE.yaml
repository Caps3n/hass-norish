## 🎨 Styling-Tipps

### Custom CSS (mit card-mod)

```yaml
type: picture-entity
entity: sensor.norish_mittagessen
card_mod:
  style: |
    ha-card {
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .name {
      font-size: 18px;
      font-weight: bold;
      padding: 10px;
    }
    .state {
      font-size: 16px;
      padding: 5px 10px 10px;
    }
```

**Hinweis:** Benötigt [card-mod](https://github.com/thomasloven/lovelace-card-mod)

---

## 📱 Beste Konfiguration für verschiedene Geräte

### Desktop/Tablet (breiter Bildschirm)
→ Verwende **Grid Layout** (Option 4) oder **Horizontal Stack**

### Smartphone (schmal)
→ Verwende **Vertical Stack** (Option 3) oder **Swipe Card** (Option 8)

### Alle Geräte (responsiv)
→ Verwende **Grid mit columns: 2** und **square: false**

---

## 🔧 Empfohlene Custom Components

Für die besten Ergebnisse:

1. **[button-card](https://github.com/custom-cards/button-card)** - Flexibles Styling
2. **[card-mod](https://github.com/thomasloven/lovelace-card-mod)** - Custom CSS
3. **[atomic-calendar-revive](https://github.com/totaldebug/atomic-calendar-revive)** - Schöner Kalender
4. **[layout-card](https://github.com/thomasloven/lovelace-layout-card)** - Besseres Layout

Installation über HACS empfohlen!

---

## 🚀 Quick Start Empfehlung

**Beginne mit Option 3** (Standard-Karten, keine Custom Components nötig):
1. Kopiere die YAML
2. Füge in dein Dashboard ein
3. Passe Entities an
4. Fertig!

Später kannst du mit Custom Components erweitern.
