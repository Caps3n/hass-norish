## Home Assistant Dashboard - Norish Rezepte mit Bildern

### 🎯 Dashboard-Vorlagen

---

## 1. Einfache Karte mit Bild

```yaml
type: picture-entity
entity: sensor.norish_mittagessen
name: Mittagessen Heute
show_name: true
show_state: true
tap_action:
  action: more-info
```

**Vorschau:**
```
┌─────────────────────────┐
│   [Großes Rezeptbild]   │
│                         │
│   Mittagessen Heute     │
│   Spaghetti Carbonara   │
└─────────────────────────┘
```

---

## 2. Kompakte Übersicht (alle Mahlzeiten)

```yaml
type: vertical-stack
cards:
  - type: markdown
    content: "# 🍽️ Speiseplan für {{ now().strftime('%A, %d. %B') }}"
  
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.norish_fruhstuck
        name: Frühstück
        show_state: true
        show_entity_picture: true
        entity_picture: "{{ state_attr('sensor.norish_fruhstuck', 'image') }}"
        styles:
          card:
            - height: 200px
          img_cell:
            - height: 120px
          name:
            - font-size: 14px
          state:
            - font-size: 12px
      
      - type: custom:button-card
        entity: sensor.norish_mittagessen
        name: Mittagessen
        show_state: true
        show_entity_picture: true
        entity_picture: "{{ state_attr('sensor.norish_mittagessen', 'image') }}"
        styles:
          card:
            - height: 200px
          img_cell:
            - height: 120px
      
      - type: custom:button-card
        entity: sensor.norish_abendessen
        name: Abendessen
        show_state: true
        show_entity_picture: true
        entity_picture: "{{ state_attr('sensor.norish_abendessen', 'image') }}"
        styles:
          card:
            - height: 200px
          img_cell:
            - height: 120px
```

**Hinweis:** Benötigt [button-card](https://github.com/custom-cards/button-card) Custom Component

---

## 3. Ohne Custom Components (Standard-Karten)

```yaml
type: vertical-stack
cards:
  # Header
  - type: markdown
    content: |
      # 🍽️ Heute auf dem Speiseplan
      {{ now().strftime('%A, %d. %B %Y') }}
  
  # Hauptgericht mit großem Bild
  - type: picture-entity
    entity: sensor.norish_mittagessen
    show_name: true
    show_state: true
    tap_action:
      action: more-info
  
  # Andere Mahlzeiten
  - type: entities
    title: Weitere Mahlzeiten
    entities:
      - entity: sensor.norish_fruhstuck
        secondary_info: last-changed
      - entity: sensor.norish_abendessen
        secondary_info: last-changed
      - entity: sensor.norish_snack
        secondary_info: last-changed
```

---

## 4. Grid-Layout (Modern)

```yaml
type: grid
square: false
columns: 2
cards:
  - type: picture-entity
    entity: sensor.norish_fruhstuck
    name: Frühstück
    show_state: true
    
  - type: picture-entity
    entity: sensor.norish_mittagessen
    name: Mittagessen
    show_state: true
    
  - type: picture-entity
    entity: sensor.norish_abendessen
    name: Abendessen
    show_state: true
    
  - type: picture-entity
    entity: sensor.norish_snack
    name: Snack
    show_state: true
```

**Vorschau:**
```
┌───────────┬───────────┐
│ Frühstück │Mittagessen│
│  [Bild]   │  [Bild]   │
└───────────┴───────────┘
┌───────────┬───────────┐
│Abendessen │   Snack   │
│  [Bild]   │  [Bild]   │
└───────────┴───────────┘
```

